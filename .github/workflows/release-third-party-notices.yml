name: Release Third-Party Notices

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub Release tag to receive the committed notice
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload-notices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Resolve release tag
        id: release
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          TAG="${EVENT_TAG:-${INPUT_TAG}}"
          if [ -z "${TAG}" ]; then
            echo "::error::could not determine the GitHub Release tag"
            exit 1
          fi
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Checkout the tagged commit
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Verify the committed notice
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          if [ ! -s THIRD_PARTY_NOTICES.md ]; then
            echo "::error::THIRD_PARTY_NOTICES.md is missing or empty at ${RELEASE_TAG}"
            exit 1
          fi
          git ls-files --error-unmatch THIRD_PARTY_NOTICES.md >/dev/null
          sha256sum THIRD_PARTY_NOTICES.md

      - name: Attach the exact committed notice to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release upload "${RELEASE_TAG}" THIRD_PARTY_NOTICES.md --clobber
